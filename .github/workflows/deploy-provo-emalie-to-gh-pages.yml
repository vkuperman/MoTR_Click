name: Build and Deploy Provo Experiments (MoTR_Emalie) to GitHub Pages
on:
  push:
    branches: [ MoTR_Emalie ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Provo
        run: |
          cd run_motr_in_magpie/provo
          npm install
          npm run build

      - name: Install and Build Provo SONA
        run: |
          cd run_motr_in_magpie/provo_SONA
          npm install
          npm run build

      - name: Prepare GitHub Pages bundle
        run: |
          mkdir -p pages-dist/provo-emalie pages-dist/provo_SONA
          cp -R run_motr_in_magpie/provo/dist/. pages-dist/provo-emalie/
          cp -R run_motr_in_magpie/provo_SONA/dist/. pages-dist/provo_SONA/
          touch pages-dist/.nojekyll

      - name: Deploy Provo branch builds to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-dist
          keep_files: true
